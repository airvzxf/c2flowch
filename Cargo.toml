[workspace]
members = [
    "crates/core",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Israel Alberto Roldan Vega"]
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
tree-sitter = "0.26.6"
tree-sitter-c = "0.24.1"
unicode-width = "0.2.2"
assert_cmd = "2.1.2"
tempfile = "3.26.0"
predicates = "3.1.4"
c2flowch-core = { path = "crates/core" }
