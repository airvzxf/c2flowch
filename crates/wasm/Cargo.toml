[package]
name = "c2flowch-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Convert C source code into ANSI/ISO 5807 flowcharts (WebAssembly bindings)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
c2flowch-core.workspace = true
wasm-bindgen = "=0.2.130"
# tree-sitter-c 0.24.2 compiles the C library shims of this crate for
# wasm32-unknown-unknown; 0.1.8 and later only work with tree-sitter 0.27.
# See "Pinned dependencies" in PROJECT.md before changing it.
tree-sitter-language = "=0.1.7"
