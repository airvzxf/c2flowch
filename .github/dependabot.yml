#
# Dependabot opens one pull request a week per ecosystem with the updates
# of the GitHub Actions in .github/workflows and of the Cargo dependencies
# (Cargo.lock included). CI checks each of them like any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # Pinned in crates/wasm/Cargo.toml: 0.1.8 and later only build for
      # wasm32-unknown-unknown with tree-sitter 0.27. It moves together
      # with tree-sitter and tree-sitter-c, by hand.
      - dependency-name: tree-sitter-language
    commit-message:
      prefix: build
