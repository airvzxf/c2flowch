#
# Dependabot opens one pull request a week per ecosystem with the updates
# of the GitHub Actions in .github/workflows and of the Cargo dependencies
# (Cargo.lock included). CI checks each of them like any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: build
