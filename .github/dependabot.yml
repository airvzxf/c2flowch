#
# Dependabot opens one pull request a week per ecosystem with the updates
# of the GitHub Actions in .github/workflows and of the Cargo dependencies
# (Cargo.lock included). CI checks each of them like any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # tree-sitter, tree-sitter-c and tree-sitter-language move together,
      # by hand: see "Pinned dependencies" in PROJECT.md. tree-sitter 0.27
      # needs tree-sitter-language 0.1.9, and with it tree-sitter-c 0.24.2
      # no longer builds for wasm32-unknown-unknown.
      - dependency-name: tree-sitter-language
      - dependency-name: tree-sitter
        versions: [">= 0.27"]
    commit-message:
      prefix: build
