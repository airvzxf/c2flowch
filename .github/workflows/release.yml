# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Builds the c2flowch binary for each platform and the WebAssembly
# package, attaches the archives to the GitHub release and deploys the
# browser demo (web/) to GitHub Pages when enabled (see the pages job).
# On a published release it also checks the demo on Cloudflare Pages
# (see the verify-deployment job). Runs when a release is published, or
# by hand for an existing tag.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v2.0.1)
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p c2flowch --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="c2flowch-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          bin="target/${{ matrix.target }}/release/c2flowch"
          [ -f "${bin}.exe" ] && bin="${bin}.exe"
          cp "${bin}" README.md LICENSE CHANGELOG.md "dist/${name}/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "${name}.zip" "${name}" >/dev/null
            sha256sum "${name}.zip" > "${name}.zip.sha256"
          else
            tar -czf "${name}.tar.gz" "${name}"
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi
      - name: Smoke test
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/c2flowch"
          [ -f "${bin}.exe" ] && bin="${bin}.exe"
          "${bin}" --version
          "${bin}" parse resources/c/while_break.c -o smoke.yaml
          "${bin}" render smoke.yaml
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/c2flowch-${{ env.TAG }}-${{ matrix.target }}.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.zip dist/*.zip.sha256 dist/*.tar.gz dist/*.tar.gz.sha256)
          gh release upload "${TAG}" "${files[@]}" --clobber

  wasm:
    name: WebAssembly package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm
      - name: Install wasm-bindgen-cli
        run: |
          v=$(cargo metadata --format-version 1 --locked |
            jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          wasm-bindgen --version 2>/dev/null | grep -qx "wasm-bindgen ${v}" ||
            cargo install wasm-bindgen-cli --version "${v}" --locked
      - name: Build
        run: scripts/build-wasm.bash web web/pkg
      - name: Package
        run: |
          name="c2flowch-wasm-${TAG}"
          mkdir -p "dist/${name}"
          cp web/pkg/* README.md LICENSE CHANGELOG.md "dist/${name}/"
          cd dist
          tar -czf "${name}.tar.gz" "${name}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web

  # Needs GitHub Pages set to "GitHub Actions" in the repository settings,
  # the github-pages environment allowed to deploy from v* tags, and the
  # repository variable DEPLOY_PAGES set to true.
  pages:
    name: Deploy the demo to GitHub Pages
    needs: wasm
    if: vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Cloudflare Pages deploys the main branch on its own; this job only
  # checks that https://c2flowch.rovisoft.net serves the released version.
  # The page asks for its files with ?v=<version>-<commit>, so the job
  # waits until that version appears and then fetches every asset by the
  # URL the page uses. Only on a published release: a manual run for an
  # older tag would legitimately find a newer version in production.
  verify-deployment:
    name: Verify · production serves the release
    needs: wasm
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SITE: https://c2flowch.rovisoft.net
    steps:
      - name: Wait for the released version and fetch its assets
        run: |
          set -euo pipefail
          version="${TAG#v}"
          stamp=""
          for attempt in $(seq 1 30); do
            page="$(curl -fsS --max-time 20 "${SITE}/?release=${version}" || true)"
            stamp="$(grep -oE "app\.js\?v=${version//./\\.}-[0-9a-f]+" <<<"${page}" | head -1 | cut -d= -f2 || true)"
            if [ -n "${stamp}" ]; then
              echo "✓ ${SITE}/ serves ${stamp} (attempt ${attempt})"
              break
            fi
            echo "attempt ${attempt}: production does not serve ${version} yet"
            sleep 30
          done
          if [ -z "${stamp}" ]; then
            echo "::error::${SITE}/ still does not serve version ${version} after 15 minutes. Check the Cloudflare Pages deployment of main."
            exit 1
          fi
          tag_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" -q .sha)"
          if [ "${stamp#*-}" != "${tag_commit:0:7}" ]; then
            echo "::notice::Production serves commit ${stamp#*-}, not the tag commit ${tag_commit:0:7}: main moved after the tag."
          fi
          for path in style.css app.js favicon.svg og.png pkg/c2flowch_wasm.js pkg/c2flowch_wasm_bg.wasm examples/if.c; do
            type="$(curl -fsS --max-time 20 -o /dev/null -w '%{content_type}' "${SITE}/${path}?v=${stamp}")"
            case "${path}:${type}" in
              *.css:text/css* | *.js:*javascript* | *.svg:image/svg+xml* | *.png:image/png* | *.wasm:application/wasm* | *.c:text/*) echo "✓ /${path} (${type})" ;;
              *) echo "::error::/${path}?v=${stamp} answered ${type}"; exit 1 ;;
            esac
          done
          code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "${SITE}/no-such-page")"
          if [ "${code}" != 404 ]; then
            echo "::error::${SITE}/no-such-page answered ${code}, expected 404"
            exit 1
          fi
          echo "✓ unknown paths answer 404"
          csp="$(curl -fsS --max-time 20 -o /dev/null -D - "${SITE}/" | grep -i '^content-security-policy:' || true)"
          if ! grep -q "frame-ancestors 'none'" <<<"${csp}"; then
            echo "::error::${SITE}/ does not send the Content-Security-Policy of web/src/_headers"
            exit 1
          fi
          echo "✓ ${csp%$'\r'}"
        env:
          GH_TOKEN: ${{ github.token }}
