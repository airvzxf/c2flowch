#
# Checks Cargo.lock against the RustSec advisory database. It fails on
# vulnerabilities and also on warnings (unmaintained, unsound or yanked
# crates): Dependabot only updates direct dependencies, so a transitive
# crate with an advisory shows up only here. The weekly run catches
# advisories published after the last change.
name: Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings
